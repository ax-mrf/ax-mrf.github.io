    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Debugging
        console.log('Anchor highlighting script initialized');
        
        // Elements
        const menu = document.querySelector('#menu-menu');
        const anchorHeadings = document.querySelectorAll('h3[id]');
        let lastActiveAnchor = null;
        let scrollTimeout = null;
        
        // Debug: Log found headings
        console.log('Found anchor headings:', anchorHeadings);

        // Debounce function for scroll events
        function debounce(func, wait) {
            return function() {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(func, wait);
            };
        }

        // Clear all active menu items
        function clearCurrentClasses() {
            document.querySelectorAll('#menu-menu li').forEach(item => {
                item.classList.remove('current-menu-item', 'current_page_item');
            });
        }

        // Get currently visible anchors
        function getActiveAnchors() {
            const viewportHeight = window.innerHeight;
            const scrollPosition = window.scrollY;
            const activeAnchors = [];
            const anchorPositions = [];
            
            // Calculate positions for all headings
            anchorHeadings.forEach(heading => {
                const rect = heading.getBoundingClientRect();
                const headingTop = rect.top + scrollPosition;
                const headingMiddle = headingTop + (rect.height / 2);
                const headingBottom = headingTop + rect.height;
                
                anchorPositions.push({
                    id: heading.id,
                    top: headingTop,
                    middle: headingMiddle,
                    bottom: headingBottom
                });
            });

            // Check visibility
            const viewportTop = scrollPosition;
            const viewportBottom = scrollPosition + viewportHeight;
            const documentBottom = document.documentElement.scrollHeight;

            anchorPositions.forEach((anchor, index) => {
                // Special case for first anchor
                if (index === 0 && scrollPosition <= anchor.bottom) {
                    activeAnchors.push(anchor.id);
                }
                // Special case for last anchor
                else if (index === anchorPositions.length - 1 && 
                        (viewportBottom >= documentBottom - 100 || 
                         scrollPosition >= anchor.top - 100)) {
                    activeAnchors.push(anchor.id);
                }
                // Normal case (middle of viewport)
                else if (anchor.middle >= viewportTop && anchor.middle <= viewportBottom) {
                    activeAnchors.push(anchor.id);
                }
            });

            return activeAnchors;
        }

        // Update menu highlights based on visible anchors
        function updateActiveMenuItems() {
            const activeAnchors = getActiveAnchors();
            
            clearCurrentClasses();
            
            if (activeAnchors.length > 0) {
                activeAnchors.forEach(anchorId => {
                    const menuItem = document.querySelector(`#menu-menu li a[href="/#${anchorId}"]`);
                    if (menuItem) {
                        menuItem.parentElement.classList.add('current-menu-item', 'current_page_item');
                        lastActiveAnchor = anchorId;
                    }
                });
            } else if (lastActiveAnchor) {
                const menuItem = document.querySelector(`#menu-menu li a[href="/#${lastActiveAnchor}"]`);
                if (menuItem) {
                    menuItem.parentElement.classList.add('current-menu-item', 'current_page_item');
                }
            }
        }

        // Initialize from URL hash
        if (window.location.hash) {
            lastActiveAnchor = window.location.hash.substring(1);
        }

        // Event listeners
        window.addEventListener('scroll', debounce(updateActiveMenuItems, 50));
        window.addEventListener('load', updateActiveMenuItems);
        
        // Handle menu clicks
        menu.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.getAttribute('href').startsWith('/#')) {
                const anchorId = e.target.getAttribute('href').split('#')[1];
                lastActiveAnchor = anchorId;
                setTimeout(updateActiveMenuItems, 300);
            }
        });

        // Initial update after a small delay
        setTimeout(updateActiveMenuItems, 300);
    });
    </script>
